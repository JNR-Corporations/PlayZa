<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>PlayZa • Information Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{
      --orange:#ff7a18; --blue:#22aef3; --green:#55c80a; --purple:#9a55e8;
      --yellow:#f5bd00; --rose:#ef476f;
      --ink:#172033; --muted:#718096; --bg:#f5f7fb; --line:#e6ebf2;
      --shadow:0 8px 24px rgba(25,35,55,.075);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{
      margin:0;min-height:100vh;font-family:'Nunito',sans-serif;color:var(--ink);
      background:
        radial-gradient(circle at 0 0,rgba(255,122,24,.10),transparent 25rem),
        radial-gradient(circle at 100% 10%,rgba(34,174,243,.10),transparent 24rem),
        #f5f7fb;
    }
    button{font:inherit;border:0}
    button:focus-visible{outline:3px solid rgba(34,174,243,.25);outline-offset:3px}
    .app{width:100%;max-width:460px;min-height:100vh;margin:auto;background:rgba(249,251,254,.94);overflow:hidden}
    @media(min-width:640px){
      body{padding:18px}
      .app{min-height:calc(100vh - 36px);border-radius:34px;box-shadow:0 28px 70px rgba(15,23,42,.14);border:1px solid #fff}
    }
    .content{padding:18px 15px 34px}

    /* HERO */
    .hero{
      position:relative;overflow:hidden;margin-bottom:22px;padding:20px;
      border-radius:27px;background:#fff;border:1px solid #e9edf3;
      box-shadow:0 10px 28px rgba(15,23,42,.08);
    }
    .hero:before{
      content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
      background:linear-gradient(180deg,var(--orange),#ffc400);
    }
    .hero:after{
      content:"";position:absolute;width:115px;height:115px;border-radius:50%;
      right:-48px;top:-55px;background:rgba(255,122,24,.09);
      box-shadow:-28px 55px 0 rgba(34,174,243,.055);
    }
    .hero-content{position:relative;z-index:2;padding-left:5px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
      background:#fff3e8;color:#e7650a;border:1px solid #ffd9ba;
      font-size:9px;font-weight:900;letter-spacing:.06em;text-transform:uppercase
    }
    h1,h2,h3{font-family:'Fredoka',sans-serif}
    .hero h1{font-size:27px;line-height:1.05;margin:12px 0 6px}
    .hero p{font-size:11px;line-height:1.55;font-weight:700;color:#718096;margin:0;max-width:330px}

    .section-label{display:flex;align-items:center;justify-content:space-between;margin:0 3px 10px}
    .section-label h2{font-size:16px;margin:0}
    .section-label span{font-size:9px;font-weight:900;color:#9aa5b5;text-transform:uppercase;letter-spacing:.08em}

    /* TREE */
    .tree{position:relative;padding-left:17px}
    .tree:before{
      content:"";position:absolute;left:7px;top:17px;bottom:24px;width:2px;
      background:linear-gradient(180deg,#dbe2eb,#eef2f6);
      border-radius:4px;
    }
    .tree-node{position:relative;margin-bottom:13px}
    .tree-node:before{
      content:"";position:absolute;left:-10px;top:28px;width:10px;height:2px;
      background:#dbe2eb;border-radius:4px;
    }
    .tree-dot{
      position:absolute;left:-15px;top:22px;width:10px;height:10px;border-radius:50%;
      background:#fff;border:3px solid var(--node-color);z-index:3;
      box-shadow:0 0 0 3px #f5f7fb;
    }

    /* WHITE MAIN CARDS */
    .info-button{
      --node-color:var(--orange);
      width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;
      border-radius:21px;background:#fff;color:var(--ink);cursor:pointer;text-align:left;
      position:relative;border:1px solid #e3e8ef;
      border-left:5px solid var(--node-color);
      box-shadow:0 5px 0 #e8edf3,0 9px 20px rgba(15,23,42,.055);
      transition:.18s ease;
    }
    .info-button:hover{transform:translateY(-1px);box-shadow:0 6px 0 #e8edf3,0 12px 22px rgba(15,23,42,.075)}
    .info-button:active{transform:translateY(2px);box-shadow:0 2px 0 #e8edf3,0 5px 13px rgba(15,23,42,.06)}
    .btn-orange{--node-color:var(--orange)}
    .btn-blue{--node-color:var(--blue)}
    .btn-green{--node-color:var(--green)}
    .btn-purple{--node-color:var(--purple)}
    .btn-yellow{--node-color:var(--yellow)}
    .btn-rose{--node-color:var(--rose)}

    .icon{
      width:42px;height:42px;flex:0 0 42px;border-radius:15px;display:flex;
      align-items:center;justify-content:center;font-size:17px;
      background:var(--icon-bg);color:var(--node-color);border:1px solid var(--icon-border);
    }
    .btn-orange .icon{--icon-bg:#fff2e8;--icon-border:#ffd9bb}
    .btn-blue .icon{--icon-bg:#eaf8ff;--icon-border:#c9edff}
    .btn-green .icon{--icon-bg:#effbe7;--icon-border:#d4f3bf}
    .btn-purple .icon{--icon-bg:#f5edff;--icon-border:#e6d2ff}
    .btn-yellow .icon{--icon-bg:#fff9df;--icon-border:#f7e9a9}
    .btn-rose .icon{--icon-bg:#fff0f3;--icon-border:#ffd1da}

    .button-copy{min-width:0;flex:1}
    .button-copy strong{display:block;font-family:'Fredoka',sans-serif;font-size:14px;line-height:1.1}
    .button-copy small{display:block;font-size:9.5px;font-weight:700;color:#8994a4;margin-top:4px}
    .chevron{font-size:10px;color:#a1acba;transition:transform .25s ease}
    .info-button.open .chevron{transform:rotate(180deg);color:var(--node-color)}

    /* EXPANDED COLORED BRANCH */
    .panel{
      max-height:0;overflow:hidden;opacity:0;transform:translateY(-5px);
      transition:max-height .42s cubic-bezier(.4,0,.2,1),opacity .24s ease,transform .28s ease;
    }
    .panel.open{max-height:1800px;opacity:1;transform:translateY(0)}
    .panel-inner{
      position:relative;margin:9px 5px 4px 14px;padding:16px 14px 15px;
      background:linear-gradient(145deg,var(--panel-tint),#fff 65%);
      border:1px solid var(--panel-border);border-left:3px solid var(--node-color);
      border-radius:6px 20px 20px 20px;box-shadow:0 7px 18px rgba(15,23,42,.055);
    }
    .panel-inner:before{
      content:"";position:absolute;left:-12px;top:23px;width:10px;height:2px;
      background:var(--panel-border)
    }
    .btn-orange + .panel .panel-inner{--node-color:var(--orange);--panel-tint:#fff8f1;--panel-border:#ffdcbf}
    .btn-blue + .panel .panel-inner{--node-color:var(--blue);--panel-tint:#f2fbff;--panel-border:#cfeeff}
    .btn-green + .panel .panel-inner{--node-color:var(--green);--panel-tint:#f4fced;--panel-border:#d9f2c8}
    .btn-purple + .panel .panel-inner{--node-color:var(--purple);--panel-tint:#faf5ff;--panel-border:#eadbff}
    .btn-yellow + .panel .panel-inner{--node-color:var(--yellow);--panel-tint:#fffdf0;--panel-border:#f4e8b2}
    .btn-rose + .panel .panel-inner{--node-color:var(--rose);--panel-tint:#fff5f7;--panel-border:#ffd9e0}

    .panel-inner p,.panel-inner li{color:#5f6d80;font-size:10.5px;line-height:1.7;font-weight:650}
    .panel-inner p{margin:0 0 10px}.panel-inner p:last-child{margin-bottom:0}
    .panel-inner ul{padding-left:18px;margin:7px 0 0}.panel-inner li{margin:5px 0}
    .mini-title{font-family:'Fredoka',sans-serif;font-size:14px;color:#273247;margin:0 0 7px}

    /* CHILD CARDS */
    .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .tag{
      padding:6px 9px;border-radius:10px;background:#fff;border:1px solid #e5eaf0;
      box-shadow:0 2px 6px rgba(15,23,42,.035);font-size:8.5px;font-weight:900;color:#66758a
    }
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat{
      padding:10px;border-radius:14px;background:rgba(255,255,255,.86);
      border:1px solid rgba(219,226,235,.9);box-shadow:0 3px 9px rgba(15,23,42,.035)
    }
    .stat strong{display:block;font-family:'Fredoka',sans-serif;font-size:17px}
    .stat span{display:block;color:#9aa5b5;font-size:8.5px;font-weight:800;margin-top:2px}

    /* DEVELOPERS */
    .developer-grid{display:flex;flex-direction:column;gap:10px}
    .developer-card{
      padding:12px;border-radius:18px;background:#fff;border:1px solid #e2e8f0;
      box-shadow:0 4px 13px rgba(15,23,42,.05)
    }
    .developer-top{display:flex;align-items:center;gap:11px}
    .dev-image{
      width:54px;height:54px;border-radius:50%;object-fit:cover;flex:0 0 54px;
      border:3px solid #fff;box-shadow:0 0 0 2px #dfe6ef,0 5px 12px rgba(15,23,42,.1);
      background:#e2e8f0
    }
    .developer-card h3{font-size:15px;margin:0}
    .role{font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:#f07818;margin-top:3px}
    .dev-bio{margin:9px 0 0!important;font-size:9.5px!important}
    .dev-facts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
    .fact{padding:7px 8px;border-radius:11px;background:#f8fafc;border:1px solid #edf1f5}
    .fact b{display:block;font-size:7.5px;color:#a0aabb;text-transform:uppercase}
    .fact span{display:block;font-size:8.5px;font-weight:800;color:#334155;margin-top:2px}

    .license-box{
      border-radius:16px;padding:13px;background:#fff;border:1px solid #f1d29d;
      box-shadow:inset 4px 0 0 #f5bd00,0 4px 12px rgba(15,23,42,.04)
    }
    .license-name{font-family:'Fredoka',sans-serif;font-size:15px;color:#9a6a00;margin-bottom:6px}
    .code-like{background:#202b3e;color:#dce6f2;border-radius:13px;padding:11px;font:700 8.5px/1.7 monospace;overflow:auto}
    .divider{height:1px;background:#e7ecf2;margin:13px 0}
    .timeline{display:flex;flex-direction:column;gap:9px}
    .timeline-item{display:flex;gap:9px}
    .dot{width:23px;height:23px;flex:0 0 23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:900;color:#fff}
    .timeline-item b{font-size:10.5px;color:#334155}
    .timeline-item p{font-size:9px!important;margin:2px 0 0!important}

    .footer-note{
      margin:20px 2px 0;padding:13px;border-radius:17px;text-align:center;color:#9aa5b5;
      font-size:8.5px;font-weight:800;background:#fff;border:1px solid #e6ebf1;box-shadow:0 4px 13px rgba(15,23,42,.035)
    }
  </style>
</head>

<body>
<div class="app">
  <main class="content">

    <section class="hero">
      <div class="hero-content">
        <span class="eyebrow"><i class="fa-solid fa-circle-info"></i> PlayZa Information Hub</span>
        <h1>Everything about PlayZa</h1>
        <p>A clean expandable information page — app details, developers, license, privacy, technology, roadmap and more.</p>
      </div>
    </section>

    <div class="section-label">
      <h2>Explore</h2>

</div>

const escapeHTML = (value) =>
  String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));

function developerMarkup() {
  return `
    <div class="developer-grid">
      ${PLAYZA_DATA.developers.map(dev => `
        <article class="developer-card">
          <div class="developer-top">
            <img class="dev-image" src="${escapeHTML(dev.image)}" alt="${escapeHTML(dev.name)}">
            <div>
              <h3>${escapeHTML(dev.name)}</h3>
              <div class="role">${escapeHTML(dev.role)}</div>
            </div>
          </div>
          <p class="dev-bio">${escapeHTML(dev.bio)}</p>
          <div class="dev-facts">
            ${dev.facts.map(([label,value]) => `
              <div class="fact">
                <b>${escapeHTML(label)}</b>
                <span>${escapeHTML(value)}</span>
              </div>
            `).join("")}
          </div>
        </article>
      `).join("")}
    </div>
  `;
}

  <h3 class="mini-title">Application-side security principles</h3>

  <ul>

    <li>
      <b>Local-First Data Protection</b> — PlayZa is designed around
      local-first data handling, keeping supported gameplay state,
      preferences and temporary application data on the user's device
      whenever cloud synchronization is not required.
    </li>

    <li>
      <b>Authentication</b> — Account-based features use Firebase
      Authentication where enabled. Authentication state should be
      handled through the official Firebase client SDK rather than
      storing passwords or authentication secrets inside PlayZa's
      application code.
    </li>

    <li>
      <b>No Client-Side Secrets</b> — Real private keys, service-account
      credentials, private API keys, signing credentials, database
      administrator credentials or other privileged secrets must never
      be embedded in client-side JavaScript, HTML, CSS or the distributed
      APK/PWA.
    </li>

    <li>
      <b>Public Configuration</b> — Public application configuration,
      such as Firebase web configuration required by the client SDK,
      should be treated separately from actual privileged credentials.
      Public configuration does not replace server-side authorization
      and security rules.
    </li>

    <li>
      <b>Firestore Security</b> — Cloud Firestore data should be protected
      using Firebase Security Rules with authentication checks,
      least-privilege access and user-specific authorization. Client-side
      UI checks alone must never be considered sufficient protection
      for sensitive data or operations.
    </li>

    <li>
      <b>User Data Isolation</b> — Where applicable, authenticated users
      should only be able to read or modify the records they are
      authorized to access. Sensitive ownership and authorization
      decisions should be enforced by trusted security rules rather
      than by client-side JavaScript.
    </li>

    <li>
      <b>Input Validation</b> — User-controlled values should be treated
      as untrusted input. Important operations and cloud-written data
      should be validated before being accepted by trusted backend
      services or database security rules.
    </li>

    <li>
      <b>Client-Side Limitations</b> — XP, diamonds, scores, achievements,
      boosters and other gameplay values stored on the client should
      not automatically be considered trustworthy for security-sensitive
      operations. Any value that affects protected cloud data or
      privileges should be independently validated where required.
    </li>

    <li>
      <b>Least Privilege</b> — Firebase services, database rules,
      authentication flows and third-party integrations should receive
      only the permissions required for their intended functionality.
      Unnecessary privileged access should not be exposed to the client.
    </li>

    <li>
      <b>Third-Party Services</b> — Firebase, hosting providers,
      authentication infrastructure, fonts, libraries, SDKs and other
      external services remain subject to their own security models,
      privacy policies and terms. Their permissions should be reviewed
      before production deployment.
    </li>

    <li>
      <b>Transport Security</b> — PlayZa should be served through HTTPS
      in production so communication between supported clients and
      remote services is encrypted in transit.
    </li>

    <li>
      <b>Session Protection</b> — Authentication sessions and user
      identity state should be handled through supported authentication
      mechanisms rather than custom password storage or insecure
      client-side authentication implementations.
    </li>

    <li>
      <b>PWA Security</b> — Service workers, cached resources and local
      storage should be reviewed carefully so sensitive information is
      not unnecessarily persisted or exposed through cached application
      data.
    </li>

    <li>
      <b>TWA / Android Security</b> — The Android/TWA build should use
      properly configured application identity, signing credentials and
      trusted origins. Android signing keys and other private credentials
      must remain outside publicly distributed source code.
    </li>

    <li>
      <b>Dependency Security</b> — Third-party libraries and SDKs should
      be kept under review for outdated versions, known vulnerabilities,
      unnecessary permissions and unused dependencies.
    </li>

    <li>
      <b>Production Configuration</b> — Development credentials,
      debugging features, test endpoints and temporary permissions
      should be removed or appropriately restricted before production
      deployment.
    </li>

    <li>
      <b>Error Handling</b> — Production error messages should avoid
      exposing private keys, authentication tokens, internal database
      information, implementation details or other sensitive data.
    </li>

    <li>
      <b>Security Rules Before Deployment</b> — Firebase Authentication
      settings, Firestore rules, storage rules, API restrictions,
      authorized domains and third-party service permissions should be
      reviewed before each production release.
    </li>

    <li>
      <b>Backup & Recovery</b> — Important cloud-synchronized application
      data should have an appropriate recovery strategy. Local-first
      storage should not be treated as a guaranteed backup mechanism.
    </li>

    <li>
      <b>Continuous Security Review</b> — Security is treated as an
      ongoing development responsibility. Authentication behavior,
      database rules, dependencies, cloud configuration, client-side
      storage and deployment settings should be periodically reviewed.
    </li>

  </ul>

  <p>
    <b>Security note:</b> These principles describe the intended
    application-side security approach for PlayZa and JNR Corporations.
    Actual protection depends on the deployed Firebase Authentication
    configuration, Firestore and Storage Security Rules, hosting
    configuration, Android signing setup, third-party services and
    production environment. Client-side code should never be treated
    as a trusted security boundary by itself.
  </p>
`;

function renderSections() {
  const root = document.getElementById("accordion-root");
  root.innerHTML = PLAYZA_DATA.informationSections.map(item => `
    <div class="accordion-item tree-node" data-id="${escapeHTML(item.id)}" style="--node-color:var(--${escapeHTML(item.color)})">
      <span class="tree-dot"></span>
      <button class="info-button ${escapeHTML(item.className)}" type="button" aria-expanded="false">
        <span class="icon ${escapeHTML(item.color)}"><i class="${escapeHTML(item.icon)}"></i></span>
        <span class="button-copy">
          <strong>${escapeHTML(item.title)}</strong>
          <small>${escapeHTML(item.subtitle)}</small>
        </span>
        <i class="chevron fa-solid fa-chevron-down"></i>
      </button>
      <div class="panel" aria-hidden="true">
        <div class="panel-inner">${renderContent(item.type)}</div>
      </div>
    </div>
  `).join("");
}

function setupAccordion() {
  document.querySelectorAll(".info-button").forEach(button => {
    button.addEventListener("click", () => {
      const item = button.closest(".accordion-item");
      const panel = item.querySelector(".panel");
      const isOpen = panel.classList.contains("open");

      // Multiple buttons can remain expanded.
      panel.classList.toggle("open", !isOpen);
      button.classList.toggle("open", !isOpen);
      button.setAttribute("aria-expanded", String(!isOpen));
      panel.setAttribute("aria-hidden", String(isOpen));
    });
  });
}

renderSections();
setupAccordion();
